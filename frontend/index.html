<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPHEREx Sky Blink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Task 1: page skeleton. Three areas: header, picture (stage), controls. -->

    <header class="site-header">
      <h1>SPHEREx Sky Blink</h1>
      <p>Type a spot in the sky and watch what moves.</p>
    </header>

    <main class="layout">
      <!-- LEFT: the picture and the player bar -->
      <section class="stage-area" aria-label="Sky images">
        <div class="stage">
          <!-- Task 2: the one <img> that every frame is shown in -->
          <img
            id="sky-image"
            alt="No sky image loaded yet"
            hidden
          />
          <p id="stage-message" class="stage-message">
            Enter coordinates and press Go.
          </p>
        </div>

        <!-- Task 5: animation player -->
        <div class="player" aria-label="Animation player">
          <button id="play-button" type="button" disabled>Play</button>

          <label class="visually-hidden" for="frame-slider">Frame</label>
          <input
            id="frame-slider"
            type="range"
            min="0"
            max="0"
            value="0"
            step="1"
            disabled
          />

          <label for="speed-select">Speed</label>
          <select id="speed-select">
            <option value="1000">Slow</option>
            <option value="500" selected>Normal</option>
            <option value="200">Fast</option>
          </select>
        </div>

        <!-- Status line: loading text and friendly error messages from the API -->
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <!-- RIGHT: the controls -->
      <section class="controls" aria-label="Where to look">
        <!-- Task 4: name search (preset targets only for now) -->
        <form id="name-form" class="panel">
          <h2>Search by name</h2>
          <label for="name-input">Target name</label>
          <input
            id="name-input"
            type="text"
            placeholder="Barnard's Star"
            autocomplete="off"
          />
          <button type="submit">Find</button>
          <p class="hint">
            Works for the five test targets only, for now.
          </p>
        </form>

        <!-- Task 3: RA/Dec form -->
        <form id="coord-form" class="panel">
          <h2>Or type coordinates</h2>
          <label for="ra-input">RA</label>
          <input
            id="ra-input"
            type="text"
            placeholder="133.79 or 08h55m10.8s"
            autocomplete="off"
            required
          />
          <label for="dec-input">Dec</label>
          <input
            id="dec-input"
            type="text"
            placeholder="-7.25 or -07d14m42s"
            autocomplete="off"
            required
          />
          <button type="submit">Go</button>
          <p class="hint">
            Degrees or hours/minutes/seconds both work.
          </p>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
